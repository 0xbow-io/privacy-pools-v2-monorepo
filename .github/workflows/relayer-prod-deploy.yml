name: Deploy Relayer (prod)

on:
  workflow_dispatch:
  push:
    branches: [v2.0]
    paths:
      - 'packages/relayer/**'

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/relayer-gcp-deploy.yml
    with:
      ref: ${{ github.sha }}   # required — relayer-gcp-deploy.yml defaults to 'dev' otherwise
    secrets: inherit
