name: Relayer E2E Tests

on:
  pull_request:
    branches: [dev]
    paths:
      - 'packages/relayer/**'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: Big_Guy
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify secrets
        run: |
          echo "ANVIL_FORK_URL is set: ${{ secrets.RELAYER_ANVIL_FORK_URL != '' }}"
          echo "FORK_BLOCK_NUMBER is set: ${{ vars.RELAYER_FORK_BLOCK_NUMBER != '' }}"

      - name: Run E2E tests
        env:
          ANVIL_FORK_URL: ${{ secrets.RELAYER_ANVIL_FORK_URL }}
          FORK_BLOCK_NUMBER: ${{ vars.RELAYER_FORK_BLOCK_NUMBER }}
        run: |
          docker compose -f packages/relayer/e2e/compose.yaml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tests

      - name: Cleanup
        if: always()
        env:
          ANVIL_FORK_URL: ${{ secrets.RELAYER_ANVIL_FORK_URL }}
        run: |
          docker compose -f packages/relayer/e2e/compose.yaml down
